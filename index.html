<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">

    <!-- 移动端适配 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#fcfcfc">

    <title>Ufinite-我们滴主页</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         欢迎进入主页的封面遮罩
    ========================================== -->
    <div id="welcomeCover" class="welcome-cover">

        <div class="welcome-content">

            <h2>❤️ 欢迎光临童童洲洲的主页 ❤️</h2>

            <p>
                点击下方按钮，进入 Ufinite~
            </p>

            <button id="enterBtn" class="enter-btn">
                ✨ 进入主页 ✨
            </button>

        </div>

    </div>


    <!-- =========================================
         页面头部
    ========================================== -->
    <header>

        <h1>Ufinite</h1>

        <p>
            U find ideal nature in the eyes
        </p>

    </header>


    <!-- =========================================
         爱情计时器
    ========================================== -->
    <section class="love-timer-container">

        <div id="loveTimer" class="love-timer"></div>

        <div class="timer-subtitle">
            “活到800岁”
        </div>

    </section>


    <!-- =========================================
         相册画廊
         
         注意：
         这里不再手写照片。
         所有照片由 data.js + script.js 自动生成。
    ========================================== -->
    <main id="gallery" class="gallery"></main>


    <!-- =========================================
         心动回忆录
         
         所有内容同样由 data.js 自动生成
    ========================================== -->
    <section class="memory-section">

        <div class="memory-header">

            <h2>记录一下</h2>

        </div>

        <div id="memoryTimeline" class="memory-timeline"></div>

    </section>


    <!-- =========================================
         页脚
    ========================================== -->
    <footer>

        <p>
            斯人若彩虹，遇上方知有
        </p>

    </footer>


    <!-- =========================================
         音乐播放器
    ========================================== -->
    <div class="music-player">

    <audio
        id="bgMusic"
        loop
        preload="auto"
        playsinline
        webkit-playsinline>
        <source src="music/wbintolove.mp3" type="audio/mpeg">
    </audio>

    <button id="musicBtn" class="music-btn">
        🎵 Play Music
    </button>

    </div>


    <!-- =========================================
         图片预览弹窗
    ========================================== -->
    <div id="imageModal" class="image-modal">

        <button
            id="modalClose"
            class="modal-close"
            aria-label="关闭图片">
            &times;
        </button>

        <img
            id="modalImage"
            src=""
            alt="大图预览">

        <div
            id="modalCaption"
            class="modal-caption">
        </div>

    </div>


    <!-- =========================================
         JavaScript
         
         注意加载顺序：
         先 data.js
         再 script.js
    ========================================== -->

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>

</html>
